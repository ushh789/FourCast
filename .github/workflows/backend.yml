name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  # Never cancel main runs: a new push must not interrupt a running migration
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run client:generate
      # No --fix in CI: fail on lint errors instead of silently fixing them
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run client:generate
      - run: npm run build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run client:generate
      - run: npm test

  test-integration:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Postgres is started by Testcontainers; DATABASE_URL is overridden there
    env:
      NODE_ENV: test
      BASE_URL: http://localhost:3000
      SWAGGER_USER: admin
      SWAGGER_PASSWORD: admin
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ems
      ACCESS_TOKEN_EXPIRE: 1d
      REFRESH_TOKEN_EXPIRE: 7d
      JWT_SECRET_KEY: ci-test-secret
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run client:generate
      - run: npm run test:integration -- --runInBand
      - run: npm run test:e2e -- --runInBand

  migrations-check:
    name: Migrations Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ems
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ems"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ems?schema=public
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy
      - name: Check schema.prisma has no changes missing a migration
        run: |
          if ! npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code; then
            echo "::error::schema.prisma differs from migrations. Run 'npm run db:migrate:dev' and commit the new migration."
            exit 1
          fi

  migrate:
    name: Migrate Production DB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, build, test-unit, test-integration, migrations-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Don't run two migrations against production at the same time
    concurrency:
      group: backend-migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret RENDER_DATABASE_URL is not set"
            exit 1
          fi
          npx prisma migrate deploy

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # No checkout in this job, so the workflow-level working-directory does not exist
    defaults:
      run:
        working-directory: .
    steps:
      - name: Deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_BACKEND_DEPLOY_HOOK is not set"
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
